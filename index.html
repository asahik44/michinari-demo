<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みちなり デモ（関東全域）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{ --go:#1f8a5b; --short:#3b5bdb; --avoid:#e0781a; --steep:#d0342c; --ink:#182320; --muted:#5a6763;
         --line:#d6ded7; --panel:rgba(255,255,255,.97); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:#eef2ee}
  .brand{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900}
  .panel{position:absolute;z-index:1000;background:var(--panel);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  #ctl{top:12px;left:12px;width:min(340px,calc(100vw - 24px));padding:15px 16px 13px;
    max-height:calc(100vh - 24px);overflow:auto}
  #minBtn{position:absolute;top:11px;right:11px;padding:3px 10px;font-size:15px;line-height:1.2;border-radius:9px}
  #ctl.min{padding-bottom:13px}
  #ctl.min .sub,#ctl.min #hint,#ctl.min .search,#ctl.min #results,#ctl.min .toggles,#ctl.min #res,#ctl.min .credit{display:none}
  #ctl h1{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:23px;margin:0 0 2px;padding-right:38px}
  #ctl .sub{font-size:12px;color:var(--muted);margin:0 0 11px}
  #hint{font-size:13px;color:var(--muted);margin:0 0 11px;line-height:1.65;min-height:1.6em}
  #hint b{color:var(--ink)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;transition:.12s}
  button:hover{border-color:var(--go)}
  button.arm{background:var(--go);color:#fff;border-color:var(--go)}
  button .pindot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  #bStart .pindot{background:var(--go)} #bEnd .pindot{background:#b3261e}
  button.arm .pindot{background:#fff}
  .toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .toggles button{font-size:12px;font-weight:500;padding:7px 10px}
  .toggles button.on{background:#fff6ec;border-color:var(--avoid);color:#a85610;font-weight:700}
  .toggles .lab2{align-self:center;font-size:12px;color:var(--muted)}
  .toggles button.son{background:#f0f6f2;border-color:var(--go);color:var(--go);font-weight:700}
  #res{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}
  #res.show{display:block}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cmp .c{border:1px solid var(--line);border-radius:10px;padding:10px}
  .cmp .lab{font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
  .sw{width:16px;height:4px;border-radius:2px;display:inline-block}
  .cmp .big{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
  .cmp .k{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .verdict{font-size:12.5px;color:var(--muted);margin-top:10px}.verdict b{color:var(--go)}
  .credit{margin-top:11px;font-size:11px;color:var(--muted)}
  .search{display:flex;gap:6px;margin-bottom:10px}
  .search input{flex:1;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-width:0}
  #results{margin:-2px 0 8px}
  .rrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
  .rname{flex:1;color:var(--ink);line-height:1.4;overflow:hidden;text-overflow:ellipsis}
  .rrow button{padding:5px 10px;font-size:12px;font-weight:700}
  .rnote{font-size:12px;color:var(--muted);padding:6px 0}
  #legend{bottom:12px;left:12px;padding:10px 13px;font-size:12px;color:var(--muted)}
  #legend .li{display:flex;align-items:center;gap:8px;margin:3px 0}
  #banner{position:absolute;z-index:1001;top:12px;left:50%;transform:translateX(-50%);
    background:#333;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;max-width:92vw}
  .delp{font:13px/1.6 "Noto Sans JP",sans-serif}
  .delp a{color:#b3261e;font-weight:700;text-decoration:none}
  @media(max-width:560px){ #legend{display:none} }
</style>
</head>
<body>
<div id="map"></div>
<div id="banner"></div>

<div id="ctl" class="panel">
  <button id="minBtn" title="パネルの開閉">－</button>
  <h1><span class="brand">みちなり</span> デモ</h1>
  <p class="sub">自転車の「快適ルート」を、その場で試す（関東全域対応）</p>
  <p id="hint"><b>出発地</b>ボタンを押して地図をタップ → 次に<b>到着地</b>。ピンはドラッグで微調整、クリックで削除できます。</p>
  <div class="search">
    <input id="q" type="text" placeholder="駅名・地名・住所で検索" autocomplete="off">
    <button id="bSearch">検索</button>
  </div>
  <div id="results"></div>
  <div class="btns">
    <button id="bStart"><span class="pindot"></span>出発地</button>
    <button id="bEnd"><span class="pindot"></span>到着地</button>
    <button id="bVia">経由地</button>
    <button id="bGeo">現在地</button>
    <button id="bClear">クリア</button>
    <button id="bShare">共有</button>
  </div>
  <div class="toggles" id="strength">
    <span class="lab2">快適さ</span>
    <button data-d="110">弱</button>
    <button data-d="70" class="son">中</button>
    <button data-d="40">強</button>
    <button data-d="12">川沿い</button>
  </div>
  <div class="toggles">
    <button id="tAvoid" class="on">混雑・坂を強調</button>
  </div>
  <div id="res">
    <div class="cmp">
      <div class="c"><div class="lab"><span class="sw" style="background:var(--short)"></span>標準</div>
        <div class="big" id="sD">–</div><div class="k" id="sK">距離</div></div>
      <div class="c"><div class="lab"><span class="sw" style="background:var(--go)"></span>快適</div>
        <div class="big" id="gD">–</div><div class="k" id="gK">距離</div></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </div>
  <p class="credit">道路網：OpenStreetMap／標高：国土地理院／地図：地理院地図。快適ロジック（幹線回避・坂回避・未舗装回避）はサーバー側（GraphHopper）で計算。研究・プロトタイプ段階のデモ（制作 ash4）。</p>
</div>

<div id="legend" class="panel">
  <div class="li"><span class="sw" style="background:var(--go);width:22px;height:5px"></span>快適ルート（みちなり）</div>
  <div class="li"><span class="sw" style="background:var(--short);width:22px;height:5px"></span>標準ルート</div>
  <div class="li"><span class="sw" style="background:var(--avoid);width:22px;height:5px"></span>幹線（交通量多め）</div>
  <div class="li"><span class="sw" style="background:var(--steep);width:22px;height:5px"></span>急坂</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== サーバー（GraphHopper）設定 =====
const API='https://168.138.196.21.sslip.io';
// みちなり快適モデル（幹線回避・坂回避・農道/未舗装抑制）
// distance_influence が大きいほど「わずかな快適さのための無駄な遠回り」が減る
let DINF=70; // 快適さの強さ（画面の弱/中/強で切替）。弱=110 中=70 強=40
function comfortModel(){return {
  distance_influence:DINF,
  priority:[
    {if:"road_class == TRUNK", multiply_by:"0.1"},
    {if:"road_class == PRIMARY", multiply_by:"0.3"},
    {if:"road_class == SECONDARY", multiply_by:"0.75"},
    {if:"road_class == TERTIARY", multiply_by:"0.95"},
    {if:"road_class == SERVICE || road_class == TRACK", multiply_by:"0.7"},
    {if:"surface == GRAVEL || surface == DIRT || surface == GROUND || surface == SAND || surface == UNPAVED", multiply_by:"0.4"},
    {if:"average_slope >= 6", multiply_by:"0.35"},
    {else_if:"average_slope >= 3", multiply_by:"0.75"},
    {if:"bike_network != MISSING || road_class == CYCLEWAY", multiply_by:"1"},
    {else_if:"road_class == RESIDENTIAL || road_class == LIVING_STREET || road_class == UNCLASSIFIED", multiply_by:"0.9"},
    {else:"", multiply_by:"0.78"}
  ]
};}
const TRUNK_CLASSES=new Set(["TRUNK","PRIMARY","SECONDARY"]); // 強調する幹線
const STEEP_ABS=5; // 強調する急坂（|勾配|%）

const banner=(m,show=true)=>{const b=document.getElementById('banner');b.textContent=m;b.style.display=show?'block':'none';};
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([35.83,139.58],11);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'国土地理院',maxZoom:18}).addTo(map);

let startLL=null, endLL=null, startMk=null, endMk=null, mode=null;
let vias=[], viaMks=[];   // 経由地（順番に通過）
let routeLayers=[];
let avoidLayer=L.layerGroup().addTo(map);
let avoidOn=true;

// GraphHopper /route を呼ぶ（points=[lon,lat]）
async function ghRoute(useComfort){
  const pts=[[startLL.lng,startLL.lat]];
  for(const v of vias) pts.push([v.lng,v.lat]);
  pts.push([endLL.lng,endLL.lat]);
  const body={
    points:pts,
    profile:"bike",
    "ch.disable":true,
    points_encoded:false,
    instructions:false,
    elevation:true,
    details:["road_class","average_slope"]
  };
  if(useComfort) body.custom_model=comfortModel();
  const r=await fetch(API+'/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok||!j.paths||!j.paths.length){ throw new Error((j&&j.message)||('HTTP '+r.status)); }
  return j.paths[0];
}
const toLatLng=path=>path.points.coordinates.map(c=>[c[1],c[0]]);
const fmtKm=m=>(m/1000).toFixed(2)+'km';
const fmtMin=ms=>Math.round(ms/60000)+'分';

// ルート沿いの幹線・急坂区間を強調レイヤーに描く
function buildHighlights(path){
  const co=path.points.coordinates;
  const seg=(from,to)=>co.slice(from,to+1).map(c=>[c[1],c[0]]);
  const rc=(path.details&&path.details.road_class)||[];
  for(const [f,t,v] of rc){ if(TRUNK_CLASSES.has(v))
    L.polyline(seg(f,t),{color:'#e0781a',weight:9,opacity:.5,interactive:false}).addTo(avoidLayer); }
  const sl=(path.details&&path.details.average_slope)||[];
  for(const [f,t,v] of sl){ if(v!=null&&Math.abs(v)>=STEEP_ABS)
    L.polyline(seg(f,t),{color:'#d0342c',weight:9,opacity:.5,interactive:false}).addTo(avoidLayer); }
}

function pin(color){return L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],
  html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>`});}
function viaPin(n){return L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],
  html:`<div style="width:20px;height:20px;border-radius:50%;background:#e0781a;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);color:#fff;font:700 11px/20px sans-serif;text-align:center">${n}</div>`});}
function setMode(m){mode=m;
  document.getElementById('bStart').classList.toggle('arm',m==='start');
  document.getElementById('bEnd').classList.toggle('arm',m==='end');
  document.getElementById('bVia').classList.toggle('arm',m==='via');
  const h=document.getElementById('hint');
  if(m==='start')h.innerHTML='地図をタップして<b>出発地</b>を置いてください。';
  else if(m==='end')h.innerHTML='地図をタップして<b>到着地</b>を置いてください。';
  else if(m==='via')h.innerHTML='地図をタップして<b>経由地</b>を追加（続けて何点でもOK）。';
  else h.innerHTML='ピンを<b>ドラッグ</b>で微調整／<b>クリックで削除</b>。';
}
function bindPin(mk,which){
  mk.bindPopup('<div class="delp">'+(which==='start'?'出発地':'到着地')+'<br><a href="#" data-del="'+which+'">× この地点を削除</a></div>');
}
function bindViaPin(mk){
  mk.bindPopup('<div class="delp">経由地<br><a href="#" data-delvia="1">× この経由地を削除</a></div>');
}
map.on('popupopen',ev=>{
  const el=ev.popup.getElement(); if(!el)return;
  const a=el.querySelector('[data-del]');
  if(a){ a.onclick=(e)=>{e.preventDefault(); removePoint(a.getAttribute('data-del')); map.closePopup();}; return; }
  const av=el.querySelector('[data-delvia]');
  if(av){ const src=ev.popup._source; av.onclick=(e)=>{e.preventDefault(); removeVia(src); map.closePopup();}; }
});
function renumberVias(){ viaMks.forEach((m,i)=>m.setIcon(viaPin(i+1))); }
function addVia(latlng){
  vias.push(latlng);
  const mk=L.marker(latlng,{icon:viaPin(vias.length),draggable:true,zIndexOffset:400}).addTo(map);
  bindViaPin(mk);
  mk.on('dragend',e=>{ const i=viaMks.indexOf(mk); if(i>=0)vias[i]=e.target.getLatLng(); route(); });
  viaMks.push(mk);
}
function removeVia(mk){
  const i=viaMks.indexOf(mk); if(i<0)return;
  map.removeLayer(mk); viaMks.splice(i,1); vias.splice(i,1);
  renumberVias(); route();
}
function removePoint(which){
  if(which==='start'){ if(startMk){map.removeLayer(startMk);startMk=null;} startLL=null; }
  else { if(endMk){map.removeLayer(endMk);endMk=null;} endLL=null; }
  routeLayers.forEach(l=>map.removeLayer(l));routeLayers=[]; avoidLayer.clearLayers();
  document.getElementById('res').classList.remove('show');
  setMode(which); // 次のタップでその地点だけ置き直し
}
function placePoint(which,latlng){
  if(which==='start'){ startLL=latlng;
    if(startMk)startMk.setLatLng(latlng); else{startMk=L.marker(latlng,{icon:pin('#1f8a5b'),draggable:true,zIndexOffset:500}).addTo(map);
      bindPin(startMk,'start');
      startMk.on('dragend',e=>{startLL=e.target.getLatLng();route();});}
  }else{ endLL=latlng;
    if(endMk)endMk.setLatLng(latlng); else{endMk=L.marker(latlng,{icon:pin('#b3261e'),draggable:true,zIndexOffset:500}).addTo(map);
      bindPin(endMk,'end');
      endMk.on('dragend',e=>{endLL=e.target.getLatLng();route();});}
  }
}
async function route(){
  routeLayers.forEach(l=>map.removeLayer(l));routeLayers=[]; avoidLayer.clearLayers();
  if(!startLL||!endLL)return;
  banner('ルート計算中…');
  try{
    const [sp,gp]=await Promise.all([ghRoute(false),ghRoute(true)]);
    banner('',false);
    routeLayers.push(L.polyline(toLatLng(sp),{color:'#3b5bdb',weight:5,opacity:.9}).addTo(map));
    routeLayers.push(L.polyline(toLatLng(gp),{color:'#1f8a5b',weight:6,opacity:.95}).addTo(map));
    buildHighlights(sp); buildHighlights(gp);
    const sl=sp.distance, gl=gp.distance, pct=sl>0?Math.round((gl-sl)/sl*100):0;
    document.getElementById('sD').textContent=fmtKm(sl);
    document.getElementById('gD').textContent=fmtKm(gl);
    document.getElementById('sK').innerHTML='距離 ・ 約'+fmtMin(sp.time)+'<br>獲得標高 '+Math.round(sp.ascend||0)+'m';
    document.getElementById('gK').innerHTML='距離 ・ 約'+fmtMin(gp.time)+'<br>獲得標高 '+Math.round(gp.ascend||0)+'m';
    const climbCut=(sp.ascend||0)-(gp.ascend||0);
    let msg='快適ルートは標準より <b>'+(pct>=0?'+':'')+pct+'%</b> の距離で、幹線・急坂・未舗装を避けます。';
    if(climbCut>=5) msg+=' 登りは約 <b>'+Math.round(climbCut)+'m</b> 少なめ。';
    document.getElementById('verdict').innerHTML=msg;
    document.getElementById('res').classList.add('show');
  }catch(err){
    banner('ルート計算に失敗：'+err.message);
  }
}
map.on('click',e=>{
  if(!mode)return;               // 何も選んでいない時のタップは無視＝誤操作でルートが消えない
  if(mode==='via'){ addVia(e.latlng); if(startLL&&endLL)route(); return; } // 経由地モードは連続追加
  placePoint(mode,e.latlng);
  const other = (mode==='start')?endLL:startLL;
  if(!other){ setMode(mode==='start'?'end':'start'); }
  else { route(); setMode(null); }
});
document.getElementById('bStart').onclick=()=>setMode(mode==='start'?null:'start');
document.getElementById('bEnd').onclick=()=>setMode(mode==='end'?null:'end');
document.getElementById('bVia').onclick=()=>{
  if(!startLL||!endLL){banner('先に出発地と到着地を置いてください');setTimeout(()=>banner('',false),2000);return;}
  setMode(mode==='via'?null:'via');
};
document.getElementById('bClear').onclick=()=>{
  [startMk,endMk].forEach(m=>{if(m)map.removeLayer(m);}); startMk=endMk=startLL=endLL=null;
  viaMks.forEach(m=>map.removeLayer(m)); viaMks=[]; vias=[];
  routeLayers.forEach(l=>map.removeLayer(l));routeLayers=[]; avoidLayer.clearLayers();
  document.getElementById('res').classList.remove('show'); setMode('start');
};
document.querySelectorAll('#strength button').forEach(b=>{
  b.onclick=()=>{ DINF=parseInt(b.dataset.d,10);
    document.querySelectorAll('#strength button').forEach(x=>x.classList.remove('son'));
    b.classList.add('son');
    if(startLL&&endLL)route();
  };
});
// 現在地を出発地に
document.getElementById('bGeo').onclick=()=>{
  if(!navigator.geolocation){banner('この端末では現在地を取得できません');return;}
  banner('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{
    banner('',false);
    const ll=L.latLng(p.coords.latitude,p.coords.longitude);
    placePoint('start',ll); map.setView(ll,15);
    if(endLL){route();setMode(null);} else setMode('end');
  },err=>banner('現在地の取得に失敗：'+err.message),{enableHighAccuracy:true,timeout:8000});
};
// ルート共有（URLをコピー）
function currentShareURL(){
  const p=[];
  if(startLL)p.push('s='+startLL.lat.toFixed(5)+','+startLL.lng.toFixed(5));
  if(endLL)p.push('e='+endLL.lat.toFixed(5)+','+endLL.lng.toFixed(5));
  if(vias.length)p.push('v='+vias.map(v=>v.lat.toFixed(5)+','+v.lng.toFixed(5)).join(';'));
  p.push('d='+DINF);
  return location.origin+location.pathname+'#'+p.join('&');
}
document.getElementById('bShare').onclick=async()=>{
  if(!startLL||!endLL){banner('先に出発地と到着地を置いてください');return;}
  const u=currentShareURL();
  try{ await navigator.clipboard.writeText(u); banner('共有リンクをコピーしました'); setTimeout(()=>banner('',false),2000);}
  catch(e){ prompt('このリンクをコピーしてください', u); }
};
function selectStrength(d){
  document.querySelectorAll('#strength button').forEach(x=>x.classList.toggle('son',parseInt(x.dataset.d,10)===d));
}
function loadFromHash(){
  const h=location.hash.replace(/^#/,''); if(!h)return false;
  const q={}; h.split('&').forEach(kv=>{const i=kv.indexOf('='); if(i>0)q[kv.slice(0,i)]=kv.slice(i+1);});
  if(q.d){ const d=parseInt(q.d,10); if(d){DINF=d; selectStrength(d);} }
  if(q.s){ const [a,b]=q.s.split(',').map(Number); if(isFinite(a)&&isFinite(b))placePoint('start',L.latLng(a,b)); }
  if(q.e){ const [a,b]=q.e.split(',').map(Number); if(isFinite(a)&&isFinite(b))placePoint('end',L.latLng(a,b)); }
  if(q.v){ q.v.split(';').forEach(s=>{const [a,b]=s.split(',').map(Number); if(isFinite(a)&&isFinite(b))addVia(L.latLng(a,b));}); }
  if(startLL&&endLL){ route(); setMode(null);
    map.fitBounds([[startLL.lat,startLL.lng],[endLL.lat,endLL.lng]],{padding:[70,70]}); return true; }
  return false;
}
document.getElementById('tAvoid').onclick=(ev)=>{
  avoidOn=ev.target.classList.toggle('on');
  if(avoidOn)avoidLayer.addTo(map); else map.removeLayer(avoidLayer);
};
// ===== 地名・駅名・住所 検索（Nominatim / OpenStreetMap） =====
async function geocode(q){
  const url='https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function setFromSearch(which,lat,lon){
  const ll=L.latLng(lat,lon);
  placePoint(which,ll); map.setView(ll,14);
  if(startLL&&endLL)route();
  document.getElementById('results').innerHTML='';
}
function showResults(list){
  const box=document.getElementById('results'); box.innerHTML='';
  if(!list||!list.length){ box.innerHTML='<div class="rnote">見つかりませんでした</div>'; return; }
  list.forEach(it=>{
    const lat=parseFloat(it.lat), lon=parseFloat(it.lon);
    const row=document.createElement('div'); row.className='rrow';
    const nm=document.createElement('span'); nm.className='rname'; nm.textContent=it.display_name;
    const bS=document.createElement('button'); bS.textContent='発'; bS.onclick=()=>setFromSearch('start',lat,lon);
    const bE=document.createElement('button'); bE.textContent='着'; bE.onclick=()=>setFromSearch('end',lat,lon);
    row.appendChild(nm); row.appendChild(bS); row.appendChild(bE);
    box.appendChild(row);
  });
}
async function doSearch(){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  banner('検索中…');
  try{ const list=await geocode(q); banner('',false); showResults(list); }
  catch(err){ banner('検索に失敗：'+err.message); }
}
document.getElementById('bSearch').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); doSearch();} });

// パネル開閉（スマホでは初期は畳んで地図を広く使う）
const ctl=document.getElementById('ctl');
const minBtn=document.getElementById('minBtn');
function setMin(m){ ctl.classList.toggle('min',m); minBtn.textContent=m?'＋':'－'; }
minBtn.onclick=()=>setMin(!ctl.classList.contains('min'));
if(window.matchMedia && window.matchMedia('(max-width:560px)').matches) setMin(true);

if(!loadFromHash()) setMode('start');
</script>
